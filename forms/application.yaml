routing_rules:
#   - destination: youth
#     trigger_field_name: age
#     condition: "<18"
#   - destination: contributors
#     trigger_field_name: role_interest
#     condition: [Contributor, Other]
  - destination: default
fields:
  - name: full_name
    type: text
    required: true
    label: What's your name or preferred alias?
    note:

  - name: submitter_email
    type: email
    required: true
    label: What email address should we send your invite to?
    note:
      type: info
      title: Heads up
      text: This is the address your invite link will be sent to, so make sure you can access it.

  - name: age
    type: number
    required: true
    range: {min: 13, max: 120}
    label: How old are you?
    note:

  - name: role_interest
    type: select
    required: true
    label: What's your interest in joining?
    note:
    options:
      Member:
      Contributor:
      Other:
        name: role_interest_details
        type: text
        required: true
        label: What's your interest, in your own words?
        note:

  - name: agree_to_rules
    type: multiselect
    required: true
    label: Community guidelines
    note:
    options:
      I agree to follow the community guidelines:

  - name: interests
    type: multiselect
    required: false
    label: Which of these are you interested in?
    note:
    options:
      Discussion:
      Support:
      Events:
      Other:

  - name: bio
    type: textarea
    required: false
    length: {min: 20, max: 500}
    label: Tell us a bit about yourself.
    note:
